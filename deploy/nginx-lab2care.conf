# Nginx site for the fictional follow-up demo.
# Install: sudo cp deploy/nginx-lab2care.conf /etc/nginx/sites-available/lab2care
# Replace YOUR_DOMAIN below, e.g. 203-0-113-9.sslip.io for IP 203.0.113.9.
# Certbot then adds HTTPS and the HTTP-to-HTTPS redirect.

# Per-visitor limits on the paid AI endpoint. The app also enforces
# an hourly budget for all visitors together.
limit_req_zone $binary_remote_addr zone=lab2care_ai:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=lab2care_ai_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    server_tokens off;
    client_max_body_size 16k;

    # The API explorer is not part of the demo.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    location = /demo/agent/investigate {
        limit_req zone=lab2care_ai burst=2 nodelay;
        limit_conn lab2care_ai_conn 1;
        limit_req_status 429;
        limit_conn_status 429;

        # Several model rounds can exceed Nginx's 60 s default.
        proxy_read_timeout 180s;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }
}
